[project]
name = "saga-ui-bff"
version = "0.1.0"
description = "Backend-for-Frontend proxy for Saga UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
]

[project.scripts]
saga-ui-bff = "app.main:start"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

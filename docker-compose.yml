services:
  saga-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: saga-ui:latest
    container_name: saga-ui
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-8088}:8088"
    env_file:
      - .env
    environment:
      # These can also be set in .env; explicit here for documentation
      SAGA_BASE_URL: "${SAGA_BASE_URL:-http://localhost:8000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Saga runs externally (on a different host or container network).
# Point SAGA_BASE_URL in .env to its address, e.g.:
#   SAGA_BASE_URL=http://saga:8000
# and add it to an external network if needed:
#
# networks:
#   default:
#     external: true
#     name: saga-network
